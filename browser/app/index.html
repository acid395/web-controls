<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-controls browser</title>
<style>
  :root { --bg: #f5f6f8; --bar: #fff; --line: #d9dce2; --ink: #1c1f26; --mute: #6b7280; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --bar: #1f2229; --line: #353943; --ink: #e8eaef; --mute: #9aa1ad; --accent: #60a5fa; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .bar button { height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
  .bar button:hover { border-color: var(--accent); }
  .bar button:disabled { opacity: .4; cursor: default; }
  #url { flex: 1; min-width: 160px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  #url:focus { outline: none; border-color: var(--accent); }
  #go { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { color: var(--mute); font-size: 12px; white-space: nowrap; }
  #frame { flex: 1; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="bar">
  <button id="back" title="Back" disabled>&#8592;</button>
  <button id="fwd" title="Forward" disabled>&#8594;</button>
  <button id="reload" title="Reload" disabled>&#8635;</button>
  <input id="url" type="text" placeholder="Enter a site, e.g. www.drought.gov" autocomplete="off" spellcheck="false">
  <button id="go">Open</button>
  <span id="status"></span>
</div>
<!-- The site, on its own origin (its subdomain of this host). Sandboxed
     without allow-top-navigation: a site's frame-busting script cannot
     replace this page. -->
<iframe id="frame" name="page" title="the page"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-popups-to-escape-sandbox"
  allow="fullscreen; clipboard-write; geolocation"></iframe>
<!-- The widget, mounted on the frame: the agent, the model and the panel
     are in this page, and outlive every page the frame shows. The framed
     page carries only its manifests and a bridge (web-controls-page.js,
     which the proxy puts in), and the proxy's shim, which reports where
     the frame is. -->
<script src="/__app/proxy-url.js"></script>
<script src="/__wc/web-controls-widget.js" data-manual data-webllm="/__wc/web-llm.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const url = $("url"), frame = $("frame"), status = $("status");
  const back = $("back"), fwd = $("fwd"), reload = $("reload");
  const urls = WCProxyUrl.create(location.host, location.protocol);

  const widget = window.WebControls ? WebControls.mount({
    frame,
    title: "Ask this site",
    storageKey: "web-controls:browser",
    suggestions: ["what does this page show", "open the map"],
  }) : null;
  if (!widget) status.textContent = "widget files missing: run node widget/scripts/build.js";

  // What the frame last said about itself (the proxy's shim reports), for
  // the bar and for anything checking on the mini browser from outside.
  const page = window.__wcPage = { url: "", title: "", status: "", origin: null, reported: false };

  // https://host/path, or just host/path, to the site's proxied address.
  const toOpen = (typed) => {
    let s = String(typed || "").trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = `https://${s}`;
    try {
      const u = new URL(s);
      if (!/^https?:$/.test(u.protocol) || !u.hostname.includes(".")) return null;
      return urls.toProxy(u.href);
    } catch (e) { return null; }
  };

  const open = () => {
    const p = toOpen(url.value);
    if (!p) { status.textContent = /--/.test(url.value) ? "addresses containing -- cannot be opened here" : "type a site, like www.drought.gov"; return; }
    status.textContent = "loading…";
    page.reported = false;
    frame.src = p;
  };
  $("go").addEventListener("click", open);
  url.addEventListener("keydown", (e) => {
    if (e.key === "Enter") open();
    else if (e.key === "Escape") { url.value = page.url; url.blur(); }
  });
  // The frame is another origin: its history is asked for over a message
  // the shim answers.
  const nav = (what) => { try { frame.contentWindow.postMessage({ wc: "page-nav", do: what }, page.origin || "*"); } catch (e) { /* nothing open */ } };
  back.addEventListener("click", () => nav("back"));
  fwd.addEventListener("click", () => nav("forward"));
  reload.addEventListener("click", () => nav("reload"));

  // The pages shown, so Back is only offered when there is one to go back
  // to: a frame's history is the tab's, and going back from the first page
  // would leave the mini browser itself.
  const seen = [];
  let opened = false;
  window.addEventListener("message", (e) => {
    const m = e.data;
    if (e.source !== frame.contentWindow || !m || m.wc !== "page-state") return;
    // "leaving" is the old document's last word; the next one has not
    // spoken yet.
    page.reported = m.status !== "leaving";
    page.origin = e.origin;
    page.url = m.url || "";
    page.title = m.title || "";
    page.status = m.status;
    if (m.url && document.activeElement !== url) url.value = m.url;
    if (m.status === "loading" || m.status === "leaving") { status.textContent = "loading…"; return; }
    if (seen.length >= 2 && seen[seen.length - 2] === m.url) seen.pop(); else if (seen[seen.length - 1] !== m.url) seen.push(m.url);
    status.textContent = "";
    back.disabled = seen.length < 2;
    fwd.disabled = reload.disabled = false;
    document.title = m.title ? `${m.title} - web-controls` : "web-controls browser";
    // The address bar's own address names the page, so reloading it, or
    // bookmarking it, comes back to the same page.
    if (m.url) history.replaceState(null, "", `?site=${encodeURIComponent(m.url)}`);
    // The panel, the first time a site is open; after that, as it was left.
    if (widget && !opened) { opened = true; widget.open(); }
  });
  // A document that loads and has not reported within a moment of it did
  // not come through the proxy (a proxied one speaks before its load).
  frame.addEventListener("load", () => {
    if (page.reported) return;
    setTimeout(() => { if (!page.reported) status.textContent = "this page did not come through the proxy"; }, 800);
  });

  const first = new URLSearchParams(location.search).get("site");
  if (first) { url.value = first; open(); }
})();
</script>
</body>
</html>
