<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-controls browser</title>
<style>
  :root { --bg: #f5f6f8; --bar: #fff; --line: #d9dce2; --ink: #1c1f26; --mute: #6b7280; --accent: #2563eb; --ok: #16a34a; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --bar: #1f2229; --line: #353943; --ink: #e8eaef; --mute: #9aa1ad; --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .bar button { height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); cursor: pointer; font: inherit; }
  .bar button:hover { border-color: var(--accent); }
  .bar button:disabled { opacity: .4; cursor: default; }
  #url { flex: 1; min-width: 160px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  #url:focus { outline: none; border-color: var(--accent); }
  #go { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { color: var(--mute); font-size: 12px; white-space: nowrap; }
  .model { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .model .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .model .dot.loading { background: var(--accent); }
  .model .dot.ready { background: var(--ok); }
  .model .dot.bad { background: var(--bad); }
  .model .track { width: 80px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .model .track i { display: block; height: 100%; width: 0; background: var(--accent); }
  #frame { flex: 1; width: 100%; border: 0; background: #fff; }
  @media (max-width: 720px) { #modelText { display: none; } }
</style>
</head>
<body>
<div class="bar">
  <button id="back" title="Back" disabled>&#8592;</button>
  <button id="fwd" title="Forward" disabled>&#8594;</button>
  <button id="reload" title="Reload" disabled>&#8635;</button>
  <input id="url" type="text" placeholder="Enter a site, e.g. www.drought.gov" autocomplete="off" spellcheck="false">
  <button id="go">Open</button>
  <span id="status"></span>
  <span class="model">
    <i class="dot" id="modelDot"></i>
    <span id="modelText">Model not loaded</span>
    <span class="track" id="modelTrack" hidden><i id="modelFill"></i></span>
    <button id="loadModel" title="Load the model once; every page you open then uses it">Load model</button>
  </span>
</div>
<iframe id="frame" name="page" title="the page"></iframe>
<!-- The widget's code, for its model host only: this page mounts no panel. -->
<script src="/__wc/web-controls-widget.js" data-manual data-webllm="/__wc/web-llm.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const url = $("url"), frame = $("frame"), status = $("status");
  const back = $("back"), fwd = $("fwd"), reload = $("reload");

  // --- the model, kept here so it outlives every page the frame shows ----
  const served = window.WebControls && WebControls.serveModelHost ? WebControls.serveModelHost({ webllmUrl: "/__wc/web-llm.js" }) : null;
  const modelDot = $("modelDot"), modelText = $("modelText"), modelTrack = $("modelTrack"), modelFill = $("modelFill"), loadBtn = $("loadModel");
  const short = (id) => String(id || "").replace(/-q4f16_1-MLC$|-q0f32-MLC$/, "").replace(/-Instruct/, "");
  const drawModel = () => {
    modelText.title = "";
    if (!served) { modelText.textContent = "widget files missing: run node widget/scripts/build.js"; modelDot.className = "dot bad"; loadBtn.disabled = true; return; }
    const s = served.status();
    modelTrack.hidden = !s.loading;
    if (s.loading) modelFill.style.width = `${Math.round((s.fraction || 0) * 100)}%`;
    loadBtn.hidden = s.ready || s.loading;
    if (!s.hasGpu) { modelDot.className = "dot bad"; modelText.textContent = "No WebGPU in this browser"; loadBtn.disabled = true; }
    else if (s.ready) { modelDot.className = "dot ready"; modelText.textContent = `${short(s.model)} ready for every page`; }
    else if (s.loading) { modelDot.className = "dot loading"; modelText.textContent = `Loading ${short(s.model)} ${typeof s.fraction === "number" ? Math.round(s.fraction * 100) + "%" : ""}`; }
    else if (s.error) {
      const why = s.error.replace(/^Error:\s*/, "");
      modelDot.className = "dot bad";
      modelText.textContent = `Model failed: ${why.length > 48 ? `${why.slice(0, 48)}…` : why}`;
      modelText.title = s.error;
    }
    else { modelDot.className = "dot"; modelText.textContent = "Model not loaded"; }
  };
  // The model a page's widget chose is remembered under the page's site;
  // here, the one chosen last, else the widget's default.
  const chosenModel = () => {
    try {
      for (const k of Object.keys(localStorage)) {
        if (!k.startsWith("web-controls")) continue;
        const v = JSON.parse(localStorage.getItem(k) || "{}");
        if (v && v.llmModelId) return v.llmModelId;
      }
    } catch (e) { /* none kept */ }
    return WebControls.defaultModel;
  };
  loadBtn.addEventListener("click", () => { served.load(chosenModel()); drawModel(); });
  setInterval(drawModel, 700);
  drawModel();

  // --- the frame ----------------------------------------------------------
  // https://host/path, or just host/path, to this server's /host/path.
  const toProxied = (typed) => {
    let s = typed.trim();
    if (!s) return null;
    s = s.replace(/^https?:\/\//i, "");
    if (!/^[a-z0-9.-]+\.[a-z]{2,}(\/|$)/i.test(s)) return null;
    if (!s.includes("/")) s += "/";
    return "/" + s;
  };
  // The frame is same-origin, so its location is readable: show the real site, not our path.
  const realUrl = () => {
    try {
      const l = frame.contentWindow.location;
      if (!l.pathname || l.pathname === "/" || l.pathname.startsWith("/__app")) return "";
      const m = l.pathname.match(/^\/([a-z0-9.-]+\.[a-z]{2,})(\/.*)?$/i);
      return m ? `https://${m[1]}${m[2] || "/"}${l.search}${l.hash}` : l.href;
    } catch (e) { return ""; }
  };

  const open = () => {
    const p = toProxied(url.value);
    if (!p) { status.textContent = "type a site, like www.drought.gov"; return; }
    status.textContent = "loading…";
    frame.src = p;
  };
  $("go").addEventListener("click", open);
  url.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
  back.addEventListener("click", () => { try { frame.contentWindow.history.back(); } catch (e) { /* not ours */ } });
  fwd.addEventListener("click", () => { try { frame.contentWindow.history.forward(); } catch (e) { /* not ours */ } });
  reload.addEventListener("click", () => { try { frame.contentWindow.location.reload(); } catch (e) { /* not ours */ } });

  // Client-side routing changes the frame's URL with no load event, so the
  // bar is kept in step by a clock, one for every page the frame will show.
  const sync = () => { const r = realUrl(); if (r && document.activeElement !== url) url.value = r; };
  setInterval(sync, 1000);
  frame.addEventListener("load", () => {
    const real = realUrl();
    if (!real) return;
    url.value = real;
    status.textContent = "";
    back.disabled = fwd.disabled = reload.disabled = false;
    try {
      const w = frame.contentWindow;
      w.addEventListener("popstate", sync);
      w.addEventListener("hashchange", sync);
      if (!w.WebControls) status.textContent = "widget not in this page";
    } catch (e) { status.textContent = "page could not be read"; }
  });

  const first = new URLSearchParams(location.search).get("site");
  if (first) { url.value = first; open(); }
})();
</script>
</body>
</html>
